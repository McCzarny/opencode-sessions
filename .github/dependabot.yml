version: 2
updates:
  # Keep GitHub Actions current; outdated versions are the usual cause of
  # runner breakages.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 dropped the Node compiler API that @rollup/plugin-typescript
      # drives, which breaks the bundle. Hold majors until the plugin supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
