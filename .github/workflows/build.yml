name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate manifest
        run: npx streamdeck validate ai.opencode.streamdeck.sdPlugin

      - name: Package plugin
        run: npx streamdeck pack ai.opencode.streamdeck.sdPlugin --output dist --force

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: opencode-sessions-streamdeck
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
